# ─── CABECERAS DE SEGURIDAD ────────────────────────────────────────────────
# Este fichero se INCLUYE en cada server y en cada location. No se declaran a
# mano en varios sitios, y no es por estética:
#
# En nginx, `add_header` NO se hereda cuando el nivel hijo declara al menos
# uno. Antes estas cabeceras vivían solo a nivel de `server`, y el location de
# assets estáticos declaraba su propio `add_header Cache-Control` para cachear
# un año. Resultado: /assets/*.js y /assets/*.css se servian SIN CSP, sin
# X-Frame-Options y sin X-Content-Type-Options, que es justo donde vive el
# código ejecutado. Un include en cada nivel elimina la clase entera de fallo,
# no este caso concreto.

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;

# X-XSS-Protection se pone a 0 a proposito: los legacy XSS auditors de los
# navegadores antiguos introducian ENORMES XSS que antes no existian. Desde 2020
# la recomendacion es ponerlo a 0 y confiar en la CSP. Esta cabecera ya no
# protege nada; mantenerla activa solo da falsa sensacion de seguridad.
add_header X-XSS-Protection "0" always;

add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;

# ─── CSP ───────────────────────────────────────────────────────────────────
# Se QUITA 'unsafe-eval' de script-src. Verificado por grep sobre src/: no hay
# ningun eval( ni new Function(, y React no lo necesita, asi que la directiva
# solo servia para que un XSS tuviera ejecucion de codigo arbitrario.
#
# Se QUITA tambien 'unsafe-inline' de script-src. Era el unico motivo que lo
# justificaba: el <script type="speculationrules"> inline de index.html. Ese
# bloque no ejecuta JavaScript (es un bloque de datos) y sus dos arrays estaban
# vacios, o sea que no hacia NADA: es codigo muerto que se ha borrado. Con el
# bloque eliminado, verificado por grep sobre index.html y src/ (no queda ningun
# <script> sin src ni ningun dangerouslySetInnerHTML), no queda nada que necesite
# 'unsafe-inline'.
#
# Por que importa mas de lo que parece: el token de acceso vive solo en memoria
# (api/tokenStore.js), lo cual protege contra que lo roben del disco, pero NO
# contra un XSS. Con ejecucion de JS en el origen, el atacante llama a
# fetch('/api/usuarios/'), el interceptor de axios le anade el Authorization
# solo, y puede ademas pedir POST /api/token/refresh/ para acuñar un token
# exportable. El unico cinturon que frena eso es esta CSP. Que el token no se
# guarde en disco NO hace que la CSP sea opcional.
#
# Se eligio eliminar el codigo muerto en vez de dar un hash SHA-256 a la CSP:
# el hash es fragil (cualquier retoque obliga a recalcularlo y el fallo es
# silencioso, el navegador bloquea y no se ve en los tests).
#
# style-src conserva 'unsafe-inline' porque hay estilos inline en JSX
# (style={{...}}) en varios componentes, que CSS inline necesita.
#
# object-src, base-uri y form-action no estaban y no hacen falta en una SPA
# que no usa <object>/<embed> ni <base>: cortan la inyeccion de datos y los
# envios de formulario fuera del origen.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

# ─── HSTS ──────────────────────────────────────────────────────────────────
# DESCOMENTAR SOLO cuando el TLS ya termine en el borde Y se sirva por dominio
# real, nunca con IP. HSTS es pegajoso a proposito: el navegador cachea la
# decision y, si se activa antes de tener TLS, TODOS los visitantes quedan
# Unable de volver a http:// durante max-age, sin forma de quejarse. Es el
# error mas caro y mas comun de esta cabecera.
#
# Esta app no termina TLS en este contenedor: segun docker-compose.yml, en
# produccion el 80/443 lo pone un balanceador o un nginx del host delante, y
# es ese quien debe enviar Strict-Transport-Security. Se deja aqui el valor
# para quien prefiera emitirlo desde aqui en un despliegue con TLS integrado.
#
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
