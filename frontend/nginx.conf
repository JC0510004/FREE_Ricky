server_tokens off;

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de seguridad en un include, en lugar de escritas aqui.
    # Motivo en nginx-security-headers.conf: add_header no se hereda si el
    # nivel hijo declara alguno, asi que definirlas solo aqui dejaba al
    # location de assets (que declara su propio Cache-Control) sirviendo el
    # JavaScript sin CSP ni nosniff.
    include /etc/nginx/snippets/security-headers.conf;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El HTML nunca debe cachearse: si no, el navegador sigue apuntando al
    # bundle antiguo (los assets sí van con hash, pero el index no).
    # Se usa "expires -1" (no add_header) para no romper la herencia de las
    # cabeceras de seguridad definidas a nivel de server.
    location = /index.html {
        expires -1;
    }

    # Cache static assets
    # El include es obligatorio aqui: es el unico nivel que declara su propio
    # add_header, y sin el los assets salen sin ninguna cabecera de seguridad.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # API proxy to backend
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin panel proxy
    # NOTA: el panel de administración de Django se deshabilita en producción
    # (config/urls.py solo lo registra con DEBUG=True), por lo que no se
    # proxya /admin/ a Django: no existe ruta que servirlo.

    # Defensa en profundidad: aunque /admin/ no se sirve en producción, se
    # bloquea en el borde (403) para que, si un entorno con DEBUG=True se
    # desplegara por error, el panel nunca sea alcanzable desde fuera.
    # La ruta del panel del juego en React es /admin (sin barra final), así
    # que este location no afecta al frontend.
    location /admin/ {
        deny all;
    }

    # Deny dotfiles
    location ~ /\. {
        deny all;
    }
}

# Uncomment for production with SSL:
# server {
#     listen 80;
#     server_name _;
#     return 301 https://$host$request_uri;
# }
