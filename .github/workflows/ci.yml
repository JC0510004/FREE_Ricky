name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  SECRET_KEY: 'ci-test-key-not-for-production'
  JWT_SECRET_KEY: 'ci-test-jwt-key-not-for-production'
  DEBUG: 'False'

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq default-libmysqlclient-dev pkg-config

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run migrations
        run: |
          set +e
          python backend/manage.py migrate --skip-checks --traceback --verbosity=2 > /tmp/migrate_out.txt 2>&1
          EXIT_CODE=$?
          echo "=== migrate output ==="
          cat /tmp/migrate_out.txt
          echo "=== exit code: $EXIT_CODE ==="
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::migrate failed (exit $EXIT_CODE). See output above."
            exit 1
          fi
        working-directory: .
        env:
          DATABASE_URL: 'sqlite:///tmp/test_db.sqlite3'

      - name: Run tests
        run: python backend/manage.py test api --verbosity=2 --traceback --parallel
        working-directory: .
        env:
          DATABASE_URL: 'sqlite:///tmp/test_db.sqlite3'

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install flake8
        run: pip install flake8

      - name: Lint
        run: flake8 backend/api/ --max-line-length=120 --ignore=E501,W503

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend
        run: docker build -t free-ricky-backend:ci ./backend

      - name: Build frontend
        run: docker build -t free-ricky-frontend:ci ./frontend
