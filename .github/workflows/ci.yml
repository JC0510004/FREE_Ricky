# ══════════════════════════════════════════════════════════════════════════════
# GitHub Actions CI/CD - FREE RICKY
# Pipeline de integración continua: ejecuta tests, linting, build y Docker.
# Garantiza que cada push o PR cumple con los estándares de calidad del proyecto.
# ══════════════════════════════════════════════════════════════════════════════

name: CI/CD

# ─── TRIGGERS ───────────────────────────────────────────────────────────────
on:
  push:
    branches: [main, develop]         # FIX #15: develop también dispara el pipeline
  pull_request:
    branches: [main, develop]         # FIX #15: PRs a develop ahora sí disparan CI
  workflow_dispatch:                  # FIX #15: permite lanzar el pipeline manualmente

# ─── PERMISOS ───────────────────────────────────────────────────────────────
# FIX #12: principio de menor privilegio — el token solo lee el repo.
# Jobs que necesiten escribir (ej. deploy, release) deben declararlo explícitamente.
permissions:
  contents: read

# ─── CONCURRENCIA ────────────────────────────────────────────────────────────
# FIX #13: cancela el run anterior del mismo branch/PR si llega uno nuevo.
# Evita acumulación de runs en ráfagas de pushes a develop.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─── VARIABLES DE ENTORNO GLOBALES ──────────────────────────────────────────
env:
  SECRET_KEY: 'ci-test-key-not-for-production'
  JWT_SECRET_KEY: 'ci-test-jwt-key-not-for-production'
  DEBUG: 'False'

# ─── JOBS ───────────────────────────────────────────────────────────────────
jobs:

  # ─── JOB: TESTS DEL BACKEND ──────────────────────────────────────────────
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15               # FIX #14: evita runners colgados por SMTP u otros

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt   # FIX #16: ruta explícita

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq default-libmysqlclient-dev pkg-config

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # FIX #7: eliminados los steps "Verify Django loads" y "Run migrations" —
      # manage.py test ya importa settings y crea su propia BD de prueba internamente.
      # Eran redundantes y sumaban ~15-20s sin aportar cobertura extra.

      # FIX #2: detecta cambios en models.py que no tienen migración generada.
      # Sin esto, un modelo modificado pasa CI en verde y rompe el deploy
      # (el entrypoint ejecuta migrate y la app pide columnas inexistentes).
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
        working-directory: backend
        env:
          DATABASE_URL: 'sqlite://:memory:'   # BD real en memoria, no archivo

      - name: Run tests
        run: python manage.py test api --verbosity=2 --traceback --parallel
        working-directory: backend
        env:
          DATABASE_URL: 'sqlite://:memory:'

  # ─── JOB: LINTING DEL BACKEND ────────────────────────────────────────────
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5                # FIX #14

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt   # FIX #16

      # FIX #4: versión pinada — igual a la de requirements-dev.txt (flake8==7.3.0)
      - name: Install flake8
        run: pip install flake8==7.3.0

      # FIX #3: --extend-ignore en vez de --ignore, para no pisar la lista default
      # de flake8 (E121,E123,E126,E226,E24,E704,W503,W504). El flag anterior
      # --ignore=E501,W503 reemplazaba TODA la lista, re-habilitando 6 checks
      # que vienen suprimidos de fábrica.
      - name: Lint
        run: flake8 api/ --max-line-length=120 --extend-ignore=E501,W503
        working-directory: backend

  # ─── JOB: LINTING DEL FRONTEND ───────────────────────────────────────────
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10               # FIX #14

    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend

  # ─── JOB: BUILD DEL FRONTEND ─────────────────────────────────────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 10               # FIX #14

    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  # ─── JOB: TESTS DEL FRONTEND ─────────────────────────────────────────────
  # Ejecuta la suite de Vitest. Añadido en el fix del CI — antes estos 40 tests
  # nunca corrían en el pipeline aunque estuvieran escritos.
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10               # FIX #14

    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Run tests
        run: npm test
        working-directory: frontend

  # ─── JOB: BUILD DE DOCKER ────────────────────────────────────────────────
  # Solo se ejecuta si TODOS los jobs anteriores pasaron.
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20               # FIX #14
    # FIX: frontend-tests ya aparece en la lista (faltaba en la versión anterior)
    needs: [backend-tests, frontend-build, backend-lint, frontend-lint, frontend-tests]

    steps:
      - uses: actions/checkout@v4
      - name: Build backend
        run: docker build -t free-ricky-backend:ci ./backend
      - name: Build frontend
        run: docker build -t free-ricky-frontend:ci ./frontend

  # ─── JOB: SECURITY SCAN ──────────────────────────────────────────────────
  # FIX #1: sin continue-on-error en ningún step — el job puede fallar y
  # bloquear el pipeline.
  # FIX #4: versiones pinadas.
  #
  # pip-audit sustituye a `safety check` por dos motivos:
  #  1. `safety check` está deprecado ("unsupported beyond 01 June 2024") y
  #     cuando se elimine el job se rompe por una causa que no es un CVE.
  #  2. `safety scan` (su sustituto oficial) exige login interactivo, inviable
  #     en CI sin un secret SAFETY_API_KEY.
  #  3. Motivo de fondo: la base de advisories de safety es incompleta. Con
  #     Django 6.0.8 y sqlparse 0.6.0, safety reportaba "0 vulnerabilidades"
  #     mientras pip-audit encontraba 14 reales — 2 en djangorestframework y
  #     12 en pyjwt, que era dependencia transitiva sin pinear.
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10               # FIX #14

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache-dependency-path: backend/requirements.txt   # FIX #16
      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit==2.10.1 bandit==1.9.4         # FIX #4: versiones pinadas
        working-directory: backend
      - name: Audit Python dependencies (pip-audit)
        run: pip-audit -r requirements.txt
        working-directory: backend
        # Sin continue-on-error: un CVE nuevo bloquea el pipeline (FIX #1).
      - name: Run bandit security linter
        run: bandit -r api/ -ll
        working-directory: backend
        # Sin continue-on-error: hallazgos de bandit bloquean el pipeline (FIX #1)