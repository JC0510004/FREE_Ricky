name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  SECRET_KEY: 'ci-test-key-not-for-production'
  JWT_SECRET_KEY: 'ci-test-jwt-key-not-for-production'
  DEBUG: 'False'

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq default-libmysqlclient-dev pkg-config

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Diagnose Django setup
        run: |
          python -c "
          import os, sys
          os.environ['DJANGO_SETTINGS_MODULE'] = 'config.settings'
          os.environ['DATABASE_URL'] = 'sqlite:///tmp/test_diag.sqlite3'
          sys.path.insert(0, 'backend')
          import django
          django.setup()
          from django.core.management import call_command
          call_command('migrate', '--verbosity=2')
          " 2>&1 || true
          echo "---"
          python -c "
          import os, sys
          os.environ['DJANGO_SETTINGS_MODULE'] = 'config.settings'
          os.environ['DATABASE_URL'] = 'sqlite:///tmp/test_diag.sqlite3'
          sys.path.insert(0, 'backend')
          import config.settings as s
          print('DB_ENGINE:', s.DATABASES['default']['ENGINE'])
          print('DB_NAME:', s.DATABASES['default'].get('NAME', 'N/A'))
          print('SECRET_KEY_SET:', bool(s.SECRET_KEY))
          print('JWT_SECRET_SET:', bool(getattr(s, 'SIMPLE_JWT', {}).get('SIGNING_KEY', '')))
          print('DEBUG:', s.DEBUG)
          print('ALLOWED_HOSTS:', s.ALLOWED_HOSTS)
          print('MIDDLEWARE:', s.MIDDLEWARE)
          print('LOGS_DIR:', s.LOGS_DIR)
          print('LOGS_DIR_EXISTS:', os.path.exists(s.LOGS_DIR))
          import logging
          logging.disable(logging.CRITICAL)
          import django
          django.setup()
          print('DJANGO_SETUP_OK: True')
          " 2>&1 || echo "DJANGO_SETUP_FAILED"
        working-directory: .
        env:
          DATABASE_URL: 'sqlite:///tmp/test_diag.sqlite3'

      - name: Run migrations (skip checks)
        run: python backend/manage.py migrate --skip-checks --traceback --verbosity=2
        working-directory: .
        env:
          DATABASE_URL: 'sqlite:///tmp/test_db.sqlite3'

      - name: Run migrations (with checks)
        run: python backend/manage.py check --traceback 2>&1; python backend/manage.py migrate --traceback --verbosity=2
        continue-on-error: true
        working-directory: .
        env:
          DATABASE_URL: 'sqlite:///tmp/test_db.sqlite3'

      - name: Run tests
        run: python backend/manage.py test api --verbosity=2 --traceback --parallel
        working-directory: .
        env:
          DATABASE_URL: 'sqlite:///tmp/test_db.sqlite3'

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install flake8
        run: pip install flake8

      - name: Lint
        run: flake8 backend/api/ --max-line-length=120 --ignore=E501,W503

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend
        run: docker build -t free-ricky-backend:ci ./backend

      - name: Build frontend
        run: docker build -t free-ricky-frontend:ci ./frontend
